name: Sync publication files to Zenodo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenodo-publication-file-sync
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_UPLOAD_TOKEN }}
    steps:
      - name: Upload and verify byte-exact publication volumes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile, urllib.error, urllib.request, time
          from urllib.parse import urlsplit
          endpoint = 'https://zenodo.org/api/records/23474832/draft/files'
          source = 'https://github.com/yeyufeiyyf/prometa/releases/download/v2.0.0/'
          token = os.environ['ZENODO_TOKEN'].strip()
          assert token, 'ZENODO_UPLOAD_TOKEN is missing'
          small = json.loads('[{"name": "prometa_code_20261019_cdk6.zip", "bytes": 248234, "sha256": "5b45ecfe92ab7fcfcdb574b92396058304f2a692ecbe5a86181160467f322535", "md5": "bb4facbb23404c1b922982143ab617eb"}, {"name": "download_manifest.json", "bytes": 929, "sha256": "c4027698b8eddada7fa3cb946b881f685dfd9824aa7a316059d522d5aef91e6d", "md5": "0c4f62944f48f94c7d50baa3d0a2f483"}, {"name": "restore_zenodo_artifacts.py", "bytes": 10511, "sha256": "ddbf4123a7c74a5e5cab5e19419f5e50062b2a749a482d56ac3c3bc25c7fbf14", "md5": "6c1697d62ee6d0779c915ea4c9be6a45"}, {"name": "zenodo_volume_manifest.json", "bytes": 7240, "sha256": "8d74f838908931cd5999f7c35631fcbea8e7bbfaeb859e8fa431594661d8729d", "md5": "92f3cdc59d1514a9bdc4524d866a686e"}]')
          
          class SameOriginRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  assert urlsplit(newurl).scheme == 'https' and urlsplit(newurl).netloc == 'zenodo.org'
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          
          def api(method, url, body=None):
              assert urlsplit(url).scheme == 'https' and urlsplit(url).netloc == 'zenodo.org'
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
              if body is not None: headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, headers=headers, method=method)
              try:
                  with urllib.request.build_opener(SameOriginRedirect).open(req, timeout=180) as response:
                      data = response.read()
                      return json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Zenodo HTTP ' + str(exc.code) + ': ' + exc.read().decode()[:1000]) from None
          
          def valid(entry, row):
              return (entry and entry.get('status') == 'completed' and entry.get('size') == row['bytes']
                      and str(entry.get('checksum', '')).removeprefix('md5:') == row['md5'])
          
          def verify(path, row):
              sha = hashlib.sha256(); md5 = hashlib.md5()
              with path.open('rb') as stream:
                  while block := stream.read(1024 * 1024): sha.update(block); md5.update(block)
              assert path.stat().st_size == row['bytes'] and sha.hexdigest() == row['sha256'] and md5.hexdigest() == row['md5']
          
          def download(path, row):
              print('Downloading GitHub original:', row['name'], flush=True)
              with urllib.request.urlopen(source + row['name'], timeout=180) as response, path.open('wb') as stream:
                  while block := response.read(1024 * 1024): stream.write(block)
              verify(path, row)
          
          with tempfile.TemporaryDirectory() as directory:
              directory = pathlib.Path(directory)
              manifest_row = next(row for row in small if row['name'] == 'zenodo_volume_manifest.json')
              manifest_path = directory / manifest_row['name']; download(manifest_path, manifest_row)
              manifest = json.loads(manifest_path.read_text())
              files = small + manifest['parts']
              expected = {row['name'] for row in files}
              current = api('GET', endpoint)
              assert {entry['key'] for entry in current['entries']} <= expected
              bundle = directory / manifest['original']['name']
              for index, row in enumerate(files, 1):
                  current = api('GET', endpoint)
                  entry = next((entry for entry in current['entries'] if entry['key'] == row['name']), None)
                  if valid(entry, row):
                      print('Already verified:', index, '/', len(files), row['name'], flush=True); continue
                  path = directory / row['name']
                  if '.part' in row['name']:
                      if not bundle.exists(): download(bundle, manifest['original'])
                      part_index = next(i for i, part in enumerate(manifest['parts']) if part['name'] == row['name'])
                      with bundle.open('rb') as stream:
                          stream.seek(sum(part['bytes'] for part in manifest['parts'][:part_index]))
                          path.write_bytes(stream.read(row['bytes']))
                  elif not path.exists(): download(path, row)
                  verify(path, row)
                  for attempt in range(3):
                      if entry: api('DELETE', entry['links']['self'])
                      initialized = api('POST', endpoint, [{'key': row['name']}])
                      entry = next(entry for entry in initialized['entries'] if entry['key'] == row['name'])
                      content_url = entry['links']['content']
                      assert urlsplit(content_url).scheme == 'https' and urlsplit(content_url).netloc == 'zenodo.org'
                      escaped = token.replace('\\', '\\\\').replace('"', '\\"')
                      config = 'header = "Authorization: Bearer ' + escaped + '"\n'
                      command = ['curl', '--config', '-', '--fail-with-body', '--show-error', '--silent', '--connect-timeout', '45', '--max-time', '360',
                                 '--header', 'Content-Type: application/octet-stream', '--upload-file', str(path), '--output', str(directory / 'response.json'),
                                 '--write-out', '%{http_code} %{size_upload} %{speed_upload} %{time_total}', content_url]
                      print('Uploading:', index, '/', len(files), row['name'], 'attempt', attempt + 1, flush=True)
                      result = subprocess.run(command, input=config, text=True, capture_output=True)
                      print('Transfer (HTTP, bytes, bytes/s, seconds):', result.stdout, flush=True)
                      if result.returncode:
                          if attempt == 2: raise RuntimeError('Upload failed: ' + result.stderr[:500])
                          time.sleep(5); continue
                      committed = api('POST', entry['links']['commit'], {})
                      assert valid(committed, row)
                      print('Committed and MD5 verified:', row['name'], flush=True)
                      break
                  path.unlink()
              current = api('GET', endpoint)
              assert {entry['key'] for entry in current['entries']} == expected
              for row in files:
                  assert valid(next(entry for entry in current['entries'] if entry['key'] == row['name']), row)
          print('PASS: all 34 files verified; volume concatenation reproduces the original GitHub ZIP. Draft not published.', flush=True)
          PY
